[project]
name = "make-ai"
version = "0.1.0"
description = "Concentration estimation AI: Preprocessing, Representation Learning, and Downstream Task Pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # --- データ処理・数値計算 ---
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    # --- 時系列表現学習 (TS2Vec) ---
    "torch>=2.2.0",
    "ts2vec>=0.1",
    # --- 勾配ブースティング (下流タスク) ---
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    # --- 生体信号解析 (rPPG / BVP / HRV / フィルタ) ---
    "neurokit2>=0.2.7",
    "PyWavelets>=1.5.0",
    # --- 設定・インフラ・通信 ---
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
    "firebase-admin>=6.5.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-firestore>=2.15.0",
    "requests>=2.31.0",
    # --- 可視化 ---
    "matplotlib>=3.8.0",
]

[dependency-groups]
dev = [
    # --- 生体・画像処理 (validation, eda) ---
    "mediapipe>=0.10.0",
    "av>=12.0.0",
    "opencv-python-headless>=4.8.0",
    "qrcode>=7.4.2",
    "pillow>=10.0.0",
    # --- 実験管理・Jupyter ---
    "wandb>=0.16.0",
    "tensorboard>=2.15.0",
    "plotly>=5.18.0",
    "ipykernel>=6.29.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "nbformat>=5.11.1",
    "nbclient>=0.11.0",
    "seaborn>=0.13.2",
    "nbconvert>=7.17.2",
    "japanize-matplotlib>=1.1.3",
]

[tool.uv]
package = false