# ==============================================================================
# LM 前処理検証設定ファイル (validation/lm/config.yaml)
# ==============================================================================

# パス設定 (lm ディレクトリ基準)
paths:
  # 検証対象のランドマークZスコア化済みデータディレクトリ
  # (preprocess で出力される data/lm_normalized または data/features)
  data_dir: "../../preprocess/data/lm_normalized"
  raw_dir: "../../preprocess/data/raw"
  output_dir: "result"

# 検証対象の被験者リスト
# null: data_dir 配下の全CSVファイルを自動検出
# 指定例: ["sTfnnnrGq4", "EPu3DMEDU3"]
subjects: null

# サニティチェック (健全性検証) パラメータ
sanity_check:
  # 許容最大 NaN / Inf 比率 (0.001 = 0.1%)
  max_nan_ratio: 0.001
  max_inf_ratio: 0.0

  # サンプリング周期チェック
  expected_fps: 50.0
  dt_tolerance_sec: 0.005 # 50Hz (dt=0.02s) に対する許容誤差 (±5ms)

  # Zスコア標準化の数学的許容誤差 (個人内)
  zscore:
    mean_tolerance: 0.01  # |mean| <= 0.01
    std_tolerance: 0.01   # |std - 1.0| <= 0.01

  # 物理レンジ・差分レンジの妥当性境界 [min, max]
  physical_ranges:
    ear_ratio: [0.0, 5.0]
    head_pitch_diff: [-90.0, 90.0]
    head_yaw_diff: [-90.0, 90.0]
    head_roll_diff: [-90.0, 90.0]
    gaze_v_deg_diff: [-60.0, 60.0]
    gaze_h_deg_diff: [-60.0, 60.0]

  # 速度・加速度等のスパイク検知閾値 (Zスコア基準)
  spike_z_threshold: 8.0

# Zスコア分布確認・統計分析パラメータ
distribution:
  # 分析対象カラム (null の場合は `*_z` または `*_smooth_z` を自動選択)
  target_columns: null
  
  # 外れ値集計のZスコア閾値
  outlier_thresholds: [3.0, 5.0]
  
  # ヒストグラムのビン数
  hist_bins: 50

# グラフ可視化・レポート出力設定
visualization:
  save_plots: true
  save_csv: true
  dpi: 300
  plot_distribution_filename: "lm_zscore_distribution.png"
  plot_qq_filename: "lm_zscore_qq_plots.png"
  plot_boxplots_filename: "lm_subject_boxplots.png"
  plot_timeline_filename: "lm_timeline_preview.png"
